spring.application.name=kurashikurabe

spring.datasource.url=jdbc:mysql://localhost:3306/kurashi_kurabe?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
spring.datasource.username=kurashikurabe_user
spring.datasource.password=kurashikurabe_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration