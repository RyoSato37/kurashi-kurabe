<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('ログイン')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<main class="container my-5">
  <div class="row justify-content-center align-items-stretch g-4">

    <!-- 左：イメージ画像（スマホでは非表示） -->
    <div class="col-md-5 d-none d-md-block">
      <img th:src="@{/images/login_remotework.jpg}" alt="山を背景にノートPCで仕事をする人"
           class="auth-image">
    </div>

    <!-- 右：ログインフォーム -->
    <div class="col-md-5">
      <div class="card shadow-sm h-100">
        <div class="card-body p-4 d-flex flex-column justify-content-center">
          <h1 class="h4 mb-4 text-center">ログイン</h1>

          <!-- 5. エラーメッセージ表示エリア（認証失敗時） -->
          <div th:if="${param.error}" class="alert alert-danger" role="alert">
            メールアドレスまたはパスワードが正しくありません。
          </div>

          <form th:action="@{/login}" method="post">
            <!-- 1. メールアドレス -->
            <div class="mb-3">
              <label for="email" class="form-label">メールアドレス</label>
              <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <!-- 2. パスワード -->
            <div class="mb-4">
              <label for="password" class="form-label">パスワード</label>
              <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <!-- 3. ログインボタン -->
            <button type="submit" class="btn btn-primary w-100">ログイン</button>
          </form>

          <!-- 4. 新規登録画面へのリンク -->
          <p class="text-center mt-4 mb-0">
            アカウントをお持ちでない方は
            <a th:href="@{/register}">新規登録</a>
          </p>
        </div>
      </div>
    </div>

  </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
