<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('会員登録')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<main class="container my-5" style="max-width: 540px;">
  <h1 class="h4 mb-4">会員登録</h1>

  <form th:action="@{/register}" method="post">

    <!-- 1 登録種別 -->
    <div class="mb-3">
      <label class="form-label d-block">登録種別 <span class="text-danger">*</span></label>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="role" id="roleResident" value="RESIDENT" checked>
        <label class="form-check-label" for="roleResident">住民</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="role" id="roleWorker" value="WORKER">
        <label class="form-check-label" for="roleWorker">リモートワーカー</label>
      </div>
    </div>

    <!-- 2 ユーザー名 -->
    <div class="mb-3">
      <label for="name" class="form-label">ユーザー名 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="name" name="name" maxlength="50" placeholder="投稿時に表示される名前">
      <div class="form-text">50文字以内</div>
    </div>

    <!-- 3 メールアドレス -->
    <div class="mb-3">
      <label for="email" class="form-label">メールアドレス <span class="text-danger">*</span></label>
      <input type="email" class="form-control" id="email" name="email" maxlength="255" placeholder="example@mail.com">
      <div class="form-text">ログインIDとして使用します</div>
    </div>

    <!-- 4 パスワード -->
    <div class="mb-3">
      <label for="password" class="form-label">パスワード <span class="text-danger">*</span></label>
      <input type="password" class="form-control" id="password" name="password" maxlength="100">
      <div class="form-text">8文字以上</div>
    </div>

    <!-- 5 パスワード確認 -->
    <div class="mb-4">
      <label for="passwordConfirm" class="form-label">パスワード（確認） <span class="text-danger">*</span></label>
      <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" maxlength="100">
    </div>

    <!-- 6 登録ボタン -->
    <button type="submit" class="btn btn-primary w-100">登録する</button>
  </form>

  <!-- 7 ログイン画面へのリンク -->
  <p class="text-center mt-3 mb-0">
    すでにアカウントをお持ちの方は <a th:href="@{/login}">ログイン</a>
  </p>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
