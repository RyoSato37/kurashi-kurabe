<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<!-- head：各画面のタイトルを引数で受け取る -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | くらしくらべ'">くらしくらべ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<!-- header：①ヘッダーロゴ ②ログイン/マイページボタン -->
<header th:fragment="header">
  <nav class="navbar bg-white border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-success" th:href="@{/}">くらしくらべ</a>
      <!-- モック段階では未ログイン表示で固定。工程4でロール別に出し分ける -->
      <a class="btn btn-outline-success btn-sm" th:href="@{/login}">ログイン</a>
    </div>
  </nav>
</header>

<!-- footer -->
<footer th:fragment="footer" class="border-top mt-5 py-3 text-center text-muted small">
  &copy; くらしくらべ — 群馬県 移住比較サイト
</footer>

<!-- scripts：BootstrapのJS -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
